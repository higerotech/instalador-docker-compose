name: CI

# El CI ejecuta exactamente la misma suite que `bash tests/run-all.sh` en local.
# Las pruebas se lanzan con `docker run` desde el runner en vez de con `container:`,
# a propósito: `actions/checkout` necesita el Node que GitHub inyecta en el contenedor,
# y ese binario es glibc — dentro de una imagen Alpine (musl) el checkout falla.
# Lanzando los contenedores desde el runner, la matriz incluye Alpine sin problemas
# y CI y local no divergen.

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (preinstalado en ubuntu-latest)
        run: shellcheck install-docker.sh tests/dry-run-matrix.sh tests/hardening-merge.sh tests/run-all.sh

  docs-mermaid:
    name: Validación de diagramas Mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar bloques Mermaid de docs/
        run: python scripts/validate_mermaid.py docs

  container-matrix:
    name: Matriz dry-run en contenedores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debian 12/13, Ubuntu 22.04/24.04 y distro no soportada
        run: bash tests/dry-run-matrix.sh

  hardening-merge:
    name: Fusión no destructiva de daemon.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de fusión en contenedor desechable
        run: |
          docker run --rm -v "$PWD:/work" -w /work python:3.12-slim \
            bash tests/hardening-merge.sh

  secret-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    env:
      # Versión fijada (reproducible) + sha256 del tarball (evidencia de manipulación) — A03.
      # Al bumpear, actualiza ambos desde el fichero `checksums.txt` de la release de gitleaks.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (detección de secretos)
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}" -o "${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner
